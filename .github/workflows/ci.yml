name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Byte-compile scripts
        run: python -m compileall -q scripts
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Lockfile is hash-pinned
        run: |
          test "$(grep -c -- '--hash=sha256:' requirements.lock)" -ge 60
          ! grep -E '^[A-Za-z0-9_.-]+==' requirements.lock | grep -v -- '--hash' >/dev/null
      - name: Patch applies to the pinned flybody commit
        run: scripts/fetch_flybody.sh
