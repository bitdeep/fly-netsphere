name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Byte-compile scripts
        run: python -m compileall -q scripts
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Browser module syntax
        run: |
          node --version
          for f in web/*.js; do node --check "$f"; done
      - name: Lockfile is hash-pinned
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name, minimum in [("requirements.lock", 60), ("requirements.neural-tools.lock", 7)]:
              entries = [line for line in Path(name).read_text().splitlines()
                         if line.strip() and not line.startswith("#")]
              assert len(entries) >= minimum, name
              assert all(re.fullmatch(r"[A-Za-z0-9_.-]+==[^ ]+ --hash=sha256:[a-f0-9]{64}", line)
                         for line in entries), f"Unpinned dependency in {name}"
              print(f"{name}: {len(entries)} hash-pinned wheels")
          PY
      - name: Patch applies to the pinned flybody commit
        run: scripts/fetch_flybody.sh
